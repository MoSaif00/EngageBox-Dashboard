# Keeps the Supabase free-tier project from pausing due to inactivity.
# EngageBox project: lvxixxaydaswatvxwyhq (eu-central-1)
#
# Supabase pauses Free projects with too little DB activity over 7 days.
# Docs: a few user DB requests each day is typically enough.
# https://supabase.com/docs/guides/platform/free-project-pausing
#
# Required repo secrets:
#   SUPABASE_URL       — https://lvxixxaydaswatvxwyhq.supabase.co
#   SUPABASE_ANON_KEY  — Project Settings → API → anon / publishable key

name: Supabase Keep Alive

on:
  schedule:
    # Daily at 06:00 UTC — twice weekly is not enough for Free-tier inactivity rules
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping EngageBox database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

          ping_table() {
            local path="$1"
            local response body status
            response="$(curl -sS -w "\n%{http_code}" \
              "${SUPABASE_URL}${path}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json" \
              -H "Prefer: count=exact" \
              --max-time 30)"
            body="$(printf '%s' "$response" | sed '$d')"
            status="$(printf '%s' "$response" | tail -n1)"
            echo "GET ${path} → HTTP ${status}"
            echo "Body: ${body}"
            case "$status" in
              2??) return 0 ;;
              *)
                echo "::error::Keep-alive failed for ${path} with HTTP ${status}"
                return 1
                ;;
            esac
          }

          # Several lightweight selects so PostgREST hits Postgres with
          # enough daily activity to reset Free-tier inactivity.
          # RLS may return []; a 2xx response still counts as DB activity.
          ping_table "/rest/v1/projects?select=id&limit=1"
          ping_table "/rest/v1/feedbacks?select=id&limit=1"
          ping_table "/rest/v1/subscriptions?select=id&limit=1"

          echo "Keep-alive succeeded."
